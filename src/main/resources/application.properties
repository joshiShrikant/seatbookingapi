# ============================
# H2 DATABASE CONFIG START
# ============================
spring.datasource.url=jdbc:h2:mem:seatbookingdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console UI
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Automatically create + update tables
spring.jpa.hibernate.ddl-auto=update

# Show SQL logs (optional)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 dialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

#spring.datasource.url=jdbc:h2:file:./data/seatbookingdb

# ============================
# H2 DATABASE CONFIG ENDS
# ============================


jpa.hibernate.ddl-auto= update
jpa.show-sql= true

